; PlatformIO configuration for the FRITZ!Box ESP32 UART Bridge
; Build with: cd firmware && pio run
; Flash with: cd firmware && pio run --target upload

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; USB serial monitor baud rate (for debug output)
monitor_speed = 115200

; Use LittleFS for the data partition (upload with: pio run --target uploadfs)
board_build.filesystem = littlefs

; Compiler flags: enable verbose ESP-IDF logging level INFO
build_flags =
    -DCORE_DEBUG_LEVEL=1

; No external library dependencies – WebServer, Preferences, WiFi
; are all part of the ESP32 Arduino core.
