; PlatformIO configuration for the FRITZ!Box ESP32 UART Bridge
;
; Two build environments are provided:
;
;   esp32dev        (DEFAULT) – UART Bridge mode
;                   The ESP32 acts as a transparent UART-to-USB bridge.
;                   No WiFi, no web server.  Use this to verify the UART
;                   wiring and see raw FRITZ!Box console output.
;                   Flash:   pio run --target upload
;                   Monitor: pio device monitor  (115200 baud)
;
;   esp32dev-full   – Full WiFi + web interface mode
;                   WiFi credentials are set manually via the web UI or
;                   wifi.txt on LittleFS.  Flash and upload the filesystem:
;                   pio run -e esp32dev-full --target upload
;                   pio run -e esp32dev-full --target uploadfs

[platformio]
default_envs = esp32dev

; ---- Shared settings -------------------------------------------------------
[env]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200

; ---- UART Bridge mode (default) --------------------------------------------
[env:esp32dev]
; UART_BRIDGE_MODE defaults to 1 in config.h – no override needed here.
build_flags =
    -DCORE_DEBUG_LEVEL=1

; ---- Full WiFi + web-UI mode -----------------------------------------------
[env:esp32dev-full]
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DUART_BRIDGE_MODE=0
